<!doctype html><html><head><title>Effect verification</title></head><body style="margin:0"><script type="module">
import * as THREE from 'three/webgpu'
import { createEmissive } from './emissive.js'
import { createFireflies } from './fireflies.js'
const params={portalColor:'#7663ff',portalIntensity:1.6,portalSpeed:0.28,poleColor:'#ff4e18',poleIntensity:1,fireflyCount:60,fireflySize:0.14,caseName:'A',dayNightTime:0.32}
const scene=new THREE.Scene();scene.background=new THREE.Color('#17131e')
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(3,3,6);camera.lookAt(0,1,0)
const renderer=new THREE.WebGPURenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);await renderer.init()
const emissive=createEmissive(params);const mesh=new THREE.Mesh(new THREE.CircleGeometry(.8,64));mesh.name='Circle';mesh.position.set(0,1,-1.5);emissive.tryAttach(mesh);scene.add(mesh)
const floor=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.MeshBasicMaterial({color:'#282332'}));floor.rotation.x=-Math.PI/2;scene.add(floor)
const flies=createFireflies({scene,params,bounds:new THREE.Box3(new THREE.Vector3(-2,0,-2),new THREE.Vector3(2,1.8,2))})
renderer.setAnimationLoop(()=>{emissive.sync(1/60);flies.sync();renderer.render(scene,camera)})
</script></body></html>
